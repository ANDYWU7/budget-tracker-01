<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#244e40">
  <meta name="description" content="Track spending, subscriptions, debts, and savings.">
  <title>Pocket — Budget tracker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23244e40'/%3E%3Cpath d='M8 9h16v10q-8 10-16 0Z' fill='none' stroke='%23dcedb0' stroke-width='2.5'/%3E%3Cpath d='m13 15 3 3 4-5' fill='none' stroke='%23dcedb0' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="visuals.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" data-icon="pocket"></span>pocket<span class="brand-dot">.</span></div>
    <nav aria-label="Main navigation">
      <a href="#overview" data-nav="overview"><span data-icon="overview"></span>Overview</a>
      <a href="#spending" data-nav="spending"><span data-icon="wallet"></span>My spending</a>
      <a href="#subscriptions" data-nav="subscriptions"><span data-icon="repeat"></span>Subscriptions</a>
      <a href="#debts" data-nav="debts"><span data-icon="receipt"></span>Debts & dues</a>
      <a href="#goals" data-nav="goals"><span data-icon="target"></span>Savings goals</a>
    </nav>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="local-badge">Saved on this device</span><div class="top-actions"><button class="text-button reminder-button" data-action="reminders">Reminders <span id="notification-dot" aria-label="Payments due within 7 days">•</span></button><button class="text-button" data-action="workspace">Budget settings</button></div></header>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
